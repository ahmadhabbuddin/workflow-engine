server:
  port: 8080

spring:
  application:
    name: workflowengine

  datasource:
    url: jdbc:h2:file:./db/workflow
    driver-class-name: org.h2.Driver
    username: sa
    password: P@ss123#

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics,env,beans

  springdoc:
    api-docs:
      path: /api-docs
    swagger-ui:
      path: /swagger-ui.html

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true